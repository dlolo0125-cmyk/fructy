name: Fructy V12 CI

on:
  push:
    branches: [fructy-v12]
  pull_request:
    branches: [fructy-v12]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fructy
          POSTGRES_PASSWORD: fructy_ci_password
          POSTGRES_DB: fructy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fructy -d fructy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fructy:fructy_ci_password@localhost:5432/fructy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: find backend tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --check server.js
      - run: npm run migrate
      - run: npm run migrate
      - run: npm test
