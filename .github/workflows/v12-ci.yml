name: Fructy V12 CI

on:
  push:
    branches: [fructy-v12]
  pull_request:
    branches: [fructy-v12]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm test
