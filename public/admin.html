<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b1220"><title>Fruty Admin</title>
<link rel="icon" href="/icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0b1220;--s1:#111b2e;--s2:#17233a;--s3:#1f2f4a;--line:rgba(148,163,184,.2);--tx:#F8FAFC;--mu:#94A3B8;--cy:#22D3EE;--ok:#34D399;--wa:#FBBF24;--bad:#F87171;--g:linear-gradient(120deg,#7C3AED,#3B82F6 60%,#22D3EE)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px 60px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;z-index:-1;width:420px;height:420px;border-radius:50%;background:#7C3AED;filter:blur(110px);opacity:.28;top:-160px;right:-120px;pointer-events:none}
main{max-width:980px;margin:0 auto}h1,h2,h3{margin:0 0 10px;letter-spacing:-.01em}h2{font-size:1.15rem}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.card{background:linear-gradient(180deg,rgba(31,47,74,.5),rgba(17,27,46,.8));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.88rem;color:#CBD5E1}
input,select,textarea{width:100%;background:rgba(11,18,32,.75);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;color:inherit;margin:5px 0 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.14)}input[type=checkbox]{width:auto;margin:0 8px 0 0;vertical-align:-2px}input[type=color]{height:44px;padding:4px}
textarea{min-height:120px;resize:vertical}
button{font:inherit;color:#fff;border:0;border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--g);transition:transform .12s,filter .15s,opacity .15s}
button:hover{filter:brightness(1.1)}button:active{transform:scale(.97)}button[disabled]{opacity:.5;pointer-events:none}
button.alt{background:var(--s3);border:1px solid var(--line)}button.bad{background:rgba(248,113,113,.16);border:1px solid rgba(248,113,113,.4);color:var(--bad)}button.sm{padding:7px 12px;font-size:.88rem}
.bar{position:sticky;top:0;z-index:20;margin:0 -16px 16px;padding:12px 16px 0;background:linear-gradient(180deg,var(--bg) 82%,transparent);backdrop-filter:blur(8px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:980px;margin:0 auto}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem}.logo svg{width:30px;height:30px}.logo small{font-weight:600;color:var(--mu);font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:980px;margin:12px auto 0;padding-bottom:12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;color:var(--mu);padding:9px 14px;border-radius:12px}.tab:hover{background:var(--s2);filter:none}.tab.on{background:var(--s3);border-color:var(--line);color:var(--tx)}
.nb{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.72rem;font-weight:800;display:inline-grid;place-items:center}
.row{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;flex-wrap:wrap}.row:last-child{border-bottom:0}.row>div{flex:1;min-width:170px}small{color:var(--mu);display:block}
img.th{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none}.err{color:var(--bad);min-height:1.3em;margin:0 0 10px}code{word-break:break-all;color:var(--cy);background:rgba(34,211,238,.08);padding:2px 6px;border-radius:6px}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--s3);color:var(--mu)}.badge.ok{background:rgba(52,211,153,.15);color:var(--ok)}.badge.no{background:rgba(248,113,113,.15);color:var(--bad)}.badge.wa{background:rgba(251,191,36,.15);color:var(--wa)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}.stat span{color:var(--mu);font-size:.82rem}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.tools input{margin:0;flex:1;min-width:200px}.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{background:transparent;color:var(--mu);padding:7px 12px;font-size:.88rem}.seg button.on{background:var(--s3);color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
.sbg{position:fixed;inset:0;z-index:70;background:rgba(2,6,23,.65);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fi .15s}@keyframes fi{from{opacity:0}}
.modal{width:min(100%,460px);max-height:90vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 80px -20px #000;animation:up .2s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}.sum{margin:8px 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}.sum div:last-child{border:0}.sum dt{color:var(--mu)}.sum dd{margin:0;font-weight:700;text-align:right;word-break:break-word}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--s1);border:1px solid var(--cy);padding:11px 18px;border-radius:14px;z-index:90;font-weight:600;max-width:92vw;transition:.25s}#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{border-color:var(--bad)}
.skl{height:62px;border-radius:12px;margin-bottom:10px;background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 50%,var(--s1) 75%);background-size:200% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-200% 0}}
.login{max-width:400px;margin:12vh auto 0}.login .logo{margin-bottom:18px;font-size:1.6rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:600px){.grid2{grid-template-columns:1fr}.row>div{min-width:130px}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style></head><body><div id="toast" role="status" aria-live="polite"></div><main id="app"></main>
<script>
const $=document.getElementById("app"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const F=n=>new Intl.NumberFormat("fr-FR").format(n),D=d=>new Date(d).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"}),$v=id=>document.getElementById(id).value,q=s=>document.querySelector(s);
const coin=(t,c)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><circle cx="60" cy="60" r="57" fill="${/^#[0-9a-f]{6}$/i.test(c||"")?c:"#7C3AED"}"/><text x="60" y="62" text-anchor="middle" dominant-baseline="middle" font-size="30" font-weight="800" fill="#fff" font-family="sans-serif">${esc(t)}</text></svg>`);
const LOGO='<svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><circle cx="16" cy="16" r="14" fill="url(#cg)"/><path d="M20.5 11.5c-1-1.6-2.6-2.2-4.5-2.2-2.4 0-4 1.2-4 3 0 4.3 8.5 2 8.5 6.4 0 1.9-1.8 3.2-4.4 3.2-2 0-3.8-.8-4.8-2.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
let TK=null,tab="depots",edit=null,qf="attente",cq="",tt;
const toast=(m,e)=>{const t=document.getElementById("toast");t.textContent=m;t.className="on"+(e?" err":"");clearTimeout(tt);tt=setTimeout(()=>t.className="",3400)};
async function api(p,b,quiet){let r;try{r=await(await fetch("/api/admin/"+p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json",...(TK?{Authorization:"Bearer "+TK}:{})},body:b?JSON.stringify(b):undefined})).json()}catch{r={error:{message:"Serveur injoignable"}}}
 if(r.error){if(!quiet)toast(r.error.message,1);if(/Accès refusé|Session/i.test(r.error.message)){TK=null;loginView("Session expirée, reconnectez-vous.")}return null}return r.data??true}
const busy=async(btn,fn)=>{if(btn)btn.disabled=true;try{return await fn()}finally{if(btn)btn.disabled=false}};
function modal(html,onmount){return new Promise(res=>{const bg=document.createElement("div");bg.className="sbg";bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;const prev=document.activeElement,done=v=>{bg.remove();document.removeEventListener("keydown",kd);if(prev&&prev.focus)prev.focus();res(v)},kd=e=>{if(e.key==="Escape")done(null)};document.addEventListener("keydown",kd);bg.addEventListener("mousedown",e=>{if(e.target===bg)done(null)});document.body.appendChild(bg);bg.done=done;onmount&&onmount(bg,done);const f=bg.querySelector("[autofocus],input,button");f&&f.focus()})}
const confirmBox=(title,rows,ok,tone)=>modal(`<h2>${esc(title)}</h2><dl class="sum">${rows.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("")}</dl><div class="acts"><button class="alt" data-v="0">Annuler</button><button class="${tone||""}" data-v="1" autofocus>${esc(ok)}</button></div>`,(bg,done)=>bg.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>done(b.dataset.v==="1")));
const skel=()=>'<div class="skl"></div><div class="skl"></div><div class="skl"></div>';

function loginView(m){$.innerHTML=`<form class="card login" id="lf"><div class="logo">${LOGO}<span>Fruty</span><small>Admin</small></div><label>Téléphone<input id="ph" inputmode="tel" autocomplete="username" autofocus></label><label>Mot de passe<input id="pw" type="password" autocomplete="current-password"></label><p class="err" id="e">${esc(m||"")}</p><button style="width:100%">Connexion</button></form>`;
 lf.onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:$v("ph"),password:$v("pw")})}).then(r=>r.json()).catch(()=>({error:{message:"Serveur injoignable"}}));
  if(r.error){loginView(r.error.message)}else totpView(r.data)}}
function totpView(d){$.innerHTML=`<form class="card login" id="tf"><div class="logo">${LOGO}<span>Fruty</span><small>Admin</small></div><h2>Double authentification</h2>${d.enroll?`<p>Première connexion : ajoutez ce compte dans Google Authenticator ou Authy (« Saisir une clé de configuration ») :</p><p><code>${esc(d.secret)}</code></p>`:`<p class="mu" style="color:var(--mu)">Entrez le code à 6 chiffres de votre application d’authentification.</p>`}
 <label>Code à 6 chiffres<input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" autofocus style="font-size:1.4rem;letter-spacing:.4em;text-align:center"></label><p class="err" id="e"></p><button style="width:100%">Valider</button></form>`;
 const c=document.getElementById("code");c.oninput=()=>{c.value=c.value.replace(/\D/g,"");if(c.value.length===6)tf.requestSubmit()};
 tf.onsubmit=async e=>{e.preventDefault();const b=e.submitter;if(b)b.disabled=true;const r=await fetch("/api/admin/totp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tmp:d.tmp,code:$v("code")})}).then(r=>r.json()).catch(()=>({error:{message:"Serveur injoignable"}}));
  if(b)b.disabled=false;if(r.error){document.getElementById("e").textContent=r.error.message;c.select();return}TK=r.data.token;render()}}

const TABS=[["depots","Dépôts"],["retraits","Retraits"],["produits","Produits"],["achats","Achats clients"],["questions","Questions du jour"],["clients","Clients"],["reglages","Réglages"]];
let pend={depots:0,retraits:0};
async function counts(){const [d,w]=await Promise.all([api("list?kind=deposits",null,true),api("list?kind=withdrawals",null,true)]);pend.depots=(d||[]).filter(x=>x.status==="attente").length;pend.retraits=(w||[]).filter(x=>x.status==="attente").length;document.querySelectorAll("[data-t]").forEach(b=>{const n=pend[b.dataset.t],o=b.querySelector(".nb");if(n&&!o)b.insertAdjacentHTML("beforeend",`<span class="nb">${n}</span>`);else if(o){n?o.textContent=n:o.remove()}})}
function render(){document.title="Fruty Admin"+((pend.depots+pend.retraits)?` (${pend.depots+pend.retraits})`:"");
 $.innerHTML=`<div class="bar"><div class="top"><div class="logo">${LOGO}<span>Fruty</span><small>Admin</small></div><button class="alt sm" id="lo">Déconnexion</button></div><div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab ${tab===t[0]?"on":""}" role="tab" aria-selected="${tab===t[0]}" data-t="${t[0]}">${t[1]}${pend[t[0]]?`<span class="nb">${pend[t[0]]}</span>`:""}</button>`).join("")}</div></div><div id="v">${skel()}</div>`;
 lo.onclick=()=>{TK=null;pend={depots:0,retraits:0};loginView()};document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;edit=null;render()});
 ({depots:()=>queue("deposits","deposit"),retraits:()=>queue("withdrawals","withdrawal"),produits:products,achats:purchases,questions:questions,clients:clients,reglages:reglages})[tab]().then(()=>counts())}

async function queue(list,kind){const r=await api("list?kind="+list);if(!r)return;const v=document.getElementById("v"),np=r.filter(x=>x.status==="attente").length;
 const draw=()=>{const rows=qf==="attente"?r.filter(x=>x.status==="attente"):r;
  v.innerHTML=`<div class="stats"><div class="stat"><b>${np}</b><span>En attente</span></div><div class="stat"><b>${F(r.filter(x=>x.status==="attente").reduce((a,x)=>a+x.amount,0))} F</b><span>Montant en attente</span></div><div class="stat"><b>${r.length}</b><span>Total des demandes</span></div></div>
  <div class="tools"><div class="seg"><button data-f="attente" class="${qf==="attente"?"on":""}">En attente</button><button data-f="all" class="${qf==="all"?"on":""}">Tout l’historique</button></div></div>
  <div class="card">${rows.map(x=>`<div class="row"><div><b>+${esc(x.phone)} · ${F(x.amount)} FCFA</b><small>${D(x.created_at)} ${x.ref?"· Réf. "+esc(x.ref):"· "+esc(x.method||"")+" "+esc(x.dest||"")}</small></div>${x.status==="attente"?`<span style="display:flex;gap:8px"><button data-i="${x.id}" data-k="1">${kind==="deposit"?"Valider":"Payé"}</button><button class="bad" data-i="${x.id}" data-k="0">Refuser</button></span>`:`<span class="badge ${x.status==="valide"?"ok":"no"}">${x.status==="valide"?"Traité":"Refusé"}</span>`}</div>`).join("")||`<div class="empty">${qf==="attente"?"Rien en attente. Tout est à jour.":"Aucune opération."}</div>`}</div>`;
  v.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{qf=b.dataset.f;draw()});
  v.querySelectorAll("[data-i]").forEach(b=>b.onclick=async()=>{const x=r.find(y=>y.id===b.dataset.i),ok=b.dataset.k==="1";
   if(!await confirmBox(ok?(kind==="deposit"?"Valider ce dépôt ?":"Confirmer le paiement ?"):"Refuser cette demande ?",[["Client","+"+x.phone],["Montant",F(x.amount)+" FCFA"],[kind==="deposit"?"Référence":"Destination",kind==="deposit"?(x.ref||"—"):((x.method||"")+" "+(x.dest||""))]],ok?"Confirmer":"Refuser",ok?"":"bad"))return;
   if(await busy(b,()=>api("decide",{kind,id:x.id,ok}))){toast(ok?"Opération validée":"Demande refusée");render()}})};draw()}

async function products(){const r=await api("list?kind=products");if(!r)return;const v=document.getElementById("v");
 if(edit){const p=r.find(x=>x.id===edit);v.innerHTML=`<div class="card"><h2>${esc(p.name)}</h2><div class="row"><img class="th" src="${esc(p.image_url||coin(p.sym,p.color))}" alt=""><div><label>Logo (PNG, JPG ou WebP, 2 Mo max)<input id="img" type="file" accept="image/png,image/jpeg,image/webp"></label></div></div>
  <div class="grid2"><label>Nom<input id="n" value="${esc(p.name)}"></label><label>Sigle<input id="s" value="${esc(p.sym)}"></label><label>Couleur du logo par défaut<input id="c" type="color" value="${esc(p.color||"#7C3AED")}"></label><label>Prix FCFA (vide = bientôt)<input id="pr" type="number" min="1" value="${p.price||""}"></label><label>Durée d’accès au PDF (jours, 0 = sans expiration)<input id="days" type="number" min="0" max="3650" value="${p.access_days||0}"></label><label>Crédit promotionnel par jour (FCFA, portefeuille d’achat)<input id="reward" type="number" min="0" value="${p.daily_reward||0}"></label></div><small style="margin:-4px 0 12px">Ces paramètres s’appliquent aux nouveaux achats. Le premier crédit est versé le jour de l’achat, puis un crédit toutes les 24 h, dans la limite de la durée d’accès. Crédit non retirable en espèces. Les achats historiques sont conservés.</small><label>Résumé visible avant achat<input id="t" value="${esc(p.teaser)}"></label>
  <label>Fiche (Titre: valeur, une par ligne)<textarea id="f">${esc(p.facts)}</textarea></label><label>Contenu (## pour un titre)<textarea id="b">${esc(p.body)}</textarea></label><label>Lien PDF externe (si utilisé, son expiration ne peut pas être contrôlée par Fruty)<input id="u" value="${/^https?:\/\//.test(p.pdf_url||"")?esc(p.pdf_url):""}" placeholder="https://…"></label><label>Importer un PDF privé (10 Mo maximum)<input id="pdfFile" type="file" accept="application/pdf"></label><small style="margin:-4px 0 12px">${String(p.pdf_url||"").startsWith("/private-pdf/")?"Un PDF privé est déjà importé. Il sera protégé par la durée d’accès.":"Pour appliquer réellement l’expiration, importez le fichier PDF ici plutôt qu’un lien public."}</small><label style="display:flex;align-items:center"><input id="h" type="checkbox" ${p.hidden?"checked":""}> Masquer aux clients</label>
  <div style="display:flex;gap:10px;margin-top:6px"><button id="sv">Enregistrer</button><button class="alt" id="cn">Annuler</button></div></div>`;document.getElementById("cn").onclick=()=>{edit=null;render()};
  const rd=f=>new Promise(ok=>{const x=new FileReader();x.onload=()=>ok(x.result);x.readAsDataURL(f)});
  document.getElementById("sv").onclick=ev=>busy(ev.currentTarget,async()=>{if(!await api("product",{id:edit,name:$v("n"),sym:$v("s"),color:$v("c"),price:$v("pr"),teaser:$v("t"),facts:$v("f"),body:$v("b"),pdf_url:$v("u"),access_days:$v("days"),daily_reward:$v("reward"),hidden:document.getElementById("h").checked}))return;
   const fl=document.getElementById("img").files[0];if(fl&&!await api("image",{id:edit,dataUrl:await rd(fl)}))return;const pdf=document.getElementById("pdfFile").files[0];if(pdf){if(pdf.size>10*1024*1024||pdf.type!=="application/pdf"){toast("PDF invalide ou supérieur à 10 Mo.",1);return}if(!await api("pdf",{id:edit,dataUrl:await rd(pdf)}))return}toast("Produit enregistré");edit=null;render()});return}
 v.innerHTML=`<div class="card">${r.map(p=>`<div class="row"><img class="th" src="${esc(p.image_url||coin(p.sym,p.color))}" alt=""><div><b>${esc(p.name)}</b> ${p.hidden?'<span class="badge wa">Masqué</span>':""}<small>${p.price?F(p.price)+" FCFA":"prix à définir"} · ${p.access_days?`${p.access_days} j d’accès`:`sans expiration`} · crédit/jour ${F(p.daily_reward||0)} F</small></div><button class="alt" data-e="${p.id}">Modifier</button></div>`).join("")}<button id="add" style="margin-top:12px">Ajouter un produit</button></div>`;
 v.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{edit=b.dataset.e;render()});document.getElementById("add").onclick=ev=>busy(ev.currentTarget,async()=>{const id=await api("product",{name:"Nouveau produit",sym:"NEW",hidden:true});if(id&&id!==true){edit=id;render()}})}

async function purchases(){const r=await api("list?kind=purchases");if(!r)return;const v=document.getElementById("v");
 v.innerHTML=`<div class="stats"><div class="stat"><b>${r.length}</b><span>Achats</span></div><div class="stat"><b>${F(r.reduce((a,x)=>a+x.price,0))} F</b><span>Total vendu</span></div></div><div class="card"><h2>Historique des achats clients</h2><small style="margin-bottom:6px">Les crédits promotionnels PDF sont déposés dans le portefeuille d’achat.</small>${r.map(x=>`<div class="row"><div><b>+${esc(x.phone)} · ${esc(x.product_name)}</b><small>Achat : ${D(x.purchased_at)} · ${F(x.price)} F</small><small>${x.expires_at?`Expire : ${D(x.expires_at)}`:"Accès sans expiration"} · crédits reçus : ${F(x.rewards_paid)} F (${x.rewards_paid_count} versement(s))</small></div></div>`).join("")||'<div class="empty">Aucun achat enregistré.</div>'}</div>`}

async function questions(selectedDate){const date=selectedDate||new Date().toISOString().slice(0,10),initial=await api("list?kind=questions&date="+date);if(!initial)return;const v=document.getElementById("v");
 const rq=rows=>{const el=document.getElementById("qlist");if(!el)return;el.innerHTML=rows.map((x,i)=>{let opts=[];try{opts=JSON.parse(x.options_json)}catch{};return `<div class="row"><div><b>Question ${i+1} · ${esc(x.prompt)}</b><small>${opts.map((o,n)=>String.fromCharCode(65+n)+". "+esc(o)).join(" | ")}</small><small>Bonne réponse : ${String.fromCharCode(65+x.correct_option)} · ${x.answer_count} réponse(s)</small></div></div>`}).join("")||'<div class="empty">Aucune question pour cette date.</div>'};
 v.innerHTML=`<div class="card"><h2>Questions quotidiennes (automatiques)</h2><small style="margin-bottom:10px">Fruty tire chaque jour 4 questions au hasard parmi une banque de 50 questions sur les cryptomonnaies et les grands investisseurs. Chaque bonne réponse crédite 25 F CFA au portefeuille d’achat du client. Aucune saisie manuelle n’est nécessaire.</small><label>Date<input id="qd" type="date" value="${date}"></label></div><div class="card"><h2>Questions de cette date</h2><div id="qlist"></div></div>`;
 document.getElementById("qd").onchange=async()=>{const rows=await api("list?kind=questions&date="+encodeURIComponent($v("qd")));if(rows)rq(rows)};rq(initial)}

async function clients(){const r=await api("list?kind=users");if(!r)return;const v=document.getElementById("v");
 const act=r.filter(u=>u.active).length;
 v.innerHTML=`<div class="stats"><div class="stat"><b>${r.length}</b><span>Comptes</span></div><div class="stat"><b>${act}</b><span>Comptes activés</span></div><div class="stat"><b>${F(r.reduce((a,u)=>a+u.wallet_sub,0))} F</b><span>Portefeuilles d’achats</span></div><div class="stat"><b>${F(r.reduce((a,u)=>a+u.wallet_gain,0))} F</b><span>Gains à payer</span></div></div>
 <div class="tools"><input id="cs" type="search" placeholder="Rechercher un numéro…" value="${esc(cq)}" aria-label="Rechercher un client"></div><div class="card" id="cl"></div>`;
 const draw=()=>{const s=cq.replace(/\D/g,""),rows=r.filter(u=>!s||u.phone.includes(s));document.getElementById("cl").innerHTML=rows.map(u=>`<div class="row"><div><b>+${esc(u.phone)}</b> ${u.role==="admin"?'<span class="badge">admin</span>':""} <span class="badge ${u.active?"ok":"wa"}">${u.active?"activé":"non activé"}</span><small>${F(u.wallet_sub)} achats · ${F(u.wallet_gain)} gains · VIP ${u.vip}</small></div><button class="alt sm" data-u="${u.id}">Ajuster</button></div>`).join("")||'<div class="empty">Aucun client trouvé.</div>';
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{const u=r.find(x=>x.id===b.dataset.u);
   const res=await modal(`<h2>Ajuster +${esc(u.phone)}</h2><label>Portefeuille d’achats (FCFA)<input id="m1" type="number" min="0" value="${u.wallet_sub}" autofocus></label><label>Portefeuille de gains (FCFA)<input id="m2" type="number" min="0" value="${u.wallet_gain}"></label><label>Niveau VIP (0 à 3)<input id="m3" type="number" min="0" max="3" value="${u.vip}"></label><div class="acts"><button class="alt" data-v="0">Annuler</button><button data-v="1">Enregistrer</button></div>`,(bg,done)=>bg.querySelectorAll("[data-v]").forEach(x=>x.onclick=()=>done(x.dataset.v==="1"?{s:bg.querySelector("#m1").value,g:bg.querySelector("#m2").value,v:bg.querySelector("#m3").value}:null)));
   if(!res)return;if(await api("user",{id:u.id,sub:res.s,gain:res.g,vip:res.v,active:u.active})){toast("Client mis à jour");render()}})};
 document.getElementById("cs").oninput=e=>{cq=e.target.value;draw()};draw()}

async function reglages(){const [o,a]=await Promise.all([api("list?kind=options"),api("list?kind=announcements")]);if(!o||!a)return;const v=document.getElementById("v");
 v.innerHTML=`<div class="card"><h2>Montants de dépôt</h2><small style="margin-bottom:10px">Collez le lien de paiement Chariow de chaque montant. Le client ne voit que le montant.</small><div id="opts">${o.map(r=>`<div class="row" data-o><div><label>Montant FCFA<input class="oa" type="number" value="${r.amount}"></label></div><div><label>Nom (pour vous)<input class="ol" value="${esc(r.label)}"></label></div><div style="flex:2"><label>Lien de paiement<input class="ou" value="${esc(r.pay_url)}" placeholder="https://…"></label></div><button class="bad sm" type="button" onclick="this.closest('[data-o]').remove()">Retirer</button></div>`).join("")}</div>
  <div style="display:flex;gap:10px;margin-top:10px"><button class="alt" id="ao">Ajouter un montant</button><button id="so">Enregistrer</button></div></div>
  <div class="card"><h2>Annonces</h2><label>Titre<input id="at"></label><label>Message<textarea id="ab"></textarea></label><button id="pa">Publier</button><div style="margin-top:12px">${a.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${D(x.created_at)} · ${esc(x.body)}</small></div><button class="bad sm" data-d="${x.id}">Supprimer</button></div>`).join("")}</div></div>`;
 document.getElementById("ao").onclick=()=>{const d=document.createElement("div");d.className="row";d.dataset.o="";d.innerHTML=`<div><label>Montant FCFA<input class="oa" type="number"></label></div><div><label>Nom<input class="ol"></label></div><div style="flex:2"><label>Lien de paiement<input class="ou" placeholder="https://…"></label></div><button class="bad sm" type="button" onclick="this.closest('[data-o]').remove()">Retirer</button>`;document.getElementById("opts").appendChild(d);d.querySelector("input").focus()};
 document.getElementById("so").onclick=ev=>busy(ev.currentTarget,async()=>{const rows=[...document.querySelectorAll("[data-o]")].map(d=>({amount:d.querySelector(".oa").value,label:d.querySelector(".ol").value,pay_url:d.querySelector(".ou").value}));if(await api("options",{rows}))toast("Montants enregistrés")});
 document.getElementById("pa").onclick=ev=>busy(ev.currentTarget,async()=>{if(!$v("at").trim()||!$v("ab").trim()){toast("Titre et message requis",1);return}if(await api("announce",{title:$v("at"),body:$v("ab")})){toast("Annonce publiée");render()}});
 v.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!await confirmBox("Supprimer cette annonce ?",[["Annonce",(a.find(x=>x.id===b.dataset.d)||{}).title||""]],"Supprimer","bad"))return;if(await api("announce",{id:b.dataset.d,del:true})){toast("Annonce supprimée");render()}})}
loginView();
</script></body></html>
