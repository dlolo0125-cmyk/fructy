   else if(st==="failed"){clearInterval(iv);toast("Paiement refusé ou annulé","err");route()}
   else if(n>45){clearInterval(iv);t.textContent="Toujours en attente. Votre solde sera crédité automatiquement dès confirmation."}},4000)});
 else if(a==="share"){if(navigator.share){try{await navigator.share({text:b.dataset.t})}catch{}}else{try{await navigator.clipboard.writeText(b.dataset.t);toast("Message copié")}catch{toast("Partage indisponible","err")}}}
 else if(a==="pdf"){const win=window.open("about:blank","_blank");guard(async()=>{try{const r=await fetch(b.dataset.url,{headers:{Authorization:"Bearer "+tokget()}});if(!r.ok)throw new Error(r.status===403?"Votre accès PDF a expiré.":"Impossible d’ouvrir ce PDF.");const blob=await r.blob(),objectUrl=URL.createObjectURL(blob);if(win)win.location.href=objectUrl;else{const link=document.createElement("a");link.href=objectUrl;link.target="_blank";link.click()}setTimeout(()=>URL.revokeObjectURL(objectUrl),60000)}catch(err){if(win)win.close();toast(err.message||"Erreur PDF","err")}})}
 else if(a==="welcome")guard(async()=>{const r=await sb.rpc("claim_welcome");if(r.error){toast(r.error.message,"err");if(/Activez/.test(r.error.message))location.hash="parametres";return}toast("+200 F de bienvenue ajoutés à votre portefeuille d’achat","ok");confetti();vib(40);await load();await route()});
 else if(a==="pbonus")guard(async()=>{const r=await sb.rpc("claim_purchase_bonus");if(r.error){toast(r.error.message,"err");return}toast("+300 F de bonus ajoutés à votre portefeuille d’achat","ok");confetti();vib(40);await load();await route()});
 else if(a==="answer")guard(async()=>{const r=await sb.rpc("answer_daily_question",{qid:b.dataset.id,choice:+b.dataset.choice});if(r.error){toast(r.error.message,"err");return}b.classList.add(r.data.correct?"right":"wrong");vib(r.data.correct?35:[25,45,25]);if(r.data.correct)confetti(45);toast(r.data.correct?"Bonne réponse : +25 F dans le portefeuille d’achat":"Réponse enregistrée. Pas de crédit cette fois.",r.data.correct?"ok":"");await new Promise(z=>setTimeout(z,r.data.correct?900:1100));await load();await route(true)});
 else if(a==="vip"){const n=+b.dataset.n,pr=VIPS[n].price,left=me.wallet_sub-pr;
  if(left<0){if(await ask({title:"Solde insuffisant",icon:"wallet",body:"Il vous manque "+F(-left)+" FCFA dans votre portefeuille d’achats.",ok:"Déposer",rows:[["Prix",F(pr)+" FCFA"],["Votre solde",F(me.wallet_sub)+" FCFA","bad"]]}))location.hash="depot";return}
  if(!await ask({title:"Activer "+VIPS[n].name+" ?",icon:"crown",ok:"Activer",rows:[["Prix",F(pr)+" FCFA"],["Solde actuel",F(me.wallet_sub)+" FCFA"],["Solde après",F(left)+" FCFA"]]}))return;
  act(()=>sb.rpc("set_vip",{n}),"Niveau activé").then(ok=>{if(ok)confetti()})}
 else if(a==="buy"){const pr=+b.dataset.price,left=me.wallet_sub-pr;
  if(!me.active){toast("Activez d’abord votre compte dans Paramètres","err");location.hash="parametres";return}
  if(left<0){if(await ask({title:"Solde insuffisant",icon:"wallet",body:"Il vous manque "+F(-left)+" FCFA dans votre portefeuille d’achats.",ok:"Déposer",rows:[["Prix",F(pr)+" FCFA"],["Votre solde",F(me.wallet_sub)+" FCFA","bad"]]}))location.hash="depot";return}
  if(!await ask({title:"Débloquer « "+b.dataset.name+" » ?",icon:"shop",ok:"Acheter pour "+F(pr)+" FCFA",rows:[["Prix",F(pr)+" FCFA"],["Solde actuel",F(me.wallet_sub)+" FCFA"],["Solde après achat",F(left)+" FCFA","ok"]]}))return;
  lastBtn=b;guard(async()=>{const {error}=await sb.rpc("buy_product",{pid:b.dataset.id});
  if(error){toast(error.message,"err");if(/Activez/.test(error.message))location.hash="parametres";else if(/insuffisant/.test(error.message))location.hash="depot";return}
  toast("Formation débloquée");confetti();vib(40);await load();location.hash="lire-"+b.dataset.id;await route()})}});
document.addEventListener("click",e=>{lastBtn=e.target.closest("button.btn,a.btn[data-act]")},true);
document.addEventListener("submit",e=>{lastBtn=e.submitter||e.target.querySelector("button.btn")},true);
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="dep-amt"){const v=Math.floor(+t.value)||0;document.querySelectorAll('[data-act="amt"]').forEach(x=>x.classList.toggle("on",+x.dataset.v===v));const l=document.getElementById("pay-l");if(l)l.textContent=v>=1000?"Payer "+F(v)+" FCFA":"Payer maintenant"}
 else if(t.id==="wa"){const v=Math.floor(+t.value)||0,s=document.getElementById("wsum");document.querySelectorAll('[data-act="wamt"]').forEach(x=>x.classList.toggle("on",+x.dataset.v===v));if(s){s.className="hint";if(!v)s.textContent="";else if(v<500){s.textContent="Minimum 500 FCFA";s.classList.add("bad")}else if(v>me.wallet_gain){s.textContent="Maximum "+F(me.wallet_gain)+" FCFA (vos gains)";s.classList.add("bad")}else{s.textContent="Il vous restera "+F(me.wallet_gain-v)+" FCFA de gains";s.classList.add("ok")}}}
 else if(t.id==="rw"){const k=strength(t.value),m=document.getElementById("mt"),h=document.getElementById("mh");if(m){m.style.width=(t.value?Math.max(1,k)*25:0)+"%";m.style.background=["#F87171","#F87171","#FBBF24","#34D399","#F5B83D"][k]}if(h){h.textContent=!t.value?"6 caractères minimum. Mélangez lettres et chiffres.":t.value.length<6?"Encore "+(6-t.value.length)+" caractère(s)":["","Mot de passe correct","Bon mot de passe","Très bon mot de passe","Excellent mot de passe"][Math.max(1,k)]}}
 if(t.id==="rw"||t.id==="rw2"){const a=$v("rw"),b=$v("rw2"),m=document.getElementById("mm");if(m){m.className="hint";if(!b)m.textContent="";else if(a===b){m.textContent="Les mots de passe correspondent";m.classList.add("ok")}else{m.textContent="Les mots de passe sont différents";m.classList.add("bad")}}}});
const setErr=m=>{const e=document.getElementById("err");if(e)e.textContent=m};
document.addEventListener("submit",e=>{e.preventDefault();const id=e.target.id;
 if(id==="f-log")guard(async()=>{const ph=digits($v("lt"));if(ph.length<8)return setErr("Entrez un numéro valide.");
  const {error}=await sb.auth.signInWithPassword({email:ph+"@sika.plus",password:$v("lp")});if(error)return setErr("Téléphone ou mot de passe incorrect.");await load();location.hash="accueil";await route();refreshAnn().then(paintDot)});
 else if(id==="f-reg")guard(async()=>{const ph=digits($v("rp")),pw=$v("rw");
  if(ph.length<8||ph.length>15)return setErr("Entrez un numéro de 8 à 15 chiffres.");if(pw.length<6)return setErr("Mot de passe : 6 caractères minimum.");
  if(pw!==$v("rw2"))return setErr("Les deux mots de passe sont différents.");if(!document.getElementById("rt").checked)return setErr("Acceptez les conditions pour continuer.");
  const {data,error}=await sb.auth.signUp({email:ph+"@sika.plus",password:pw,options:{data:{phone:ph,ref:$v("rc").trim().toUpperCase()}}});
  if(error)return setErr(/registered/i.test(error.message)?"Ce numéro a déjà un compte.":error.message);
  if(!data.session)return setErr("Compte créé : connectez-vous.");await load();location.hash="accueil";await route();toast("Bienvenue sur Fruty")});
 else if(id==="f-dep"){document.querySelector('[data-act="saspay"]')?.click()}
 else if(id==="f-ret"){const w=Math.floor(+$v("wa")),m=$v("wm"),d=$v("wd");if(!(w>=500))return toast("Le retrait minimum est de 500 FCFA","err");if(w>me.wallet_gain)return toast("Vous ne pouvez pas retirer plus que vos gains ("+F(me.wallet_gain)+" FCFA)","err");if(digits(d).length<8)return toast("Numéro de réception invalide","err");
  (async()=>{if(!await ask({title:"Confirmer le retrait ?",icon:"cash",ok:"Demander le retrait",rows:[["Montant",F(w)+" FCFA"],["Réception",m+" · "+d],["Gains après",F(me.wallet_gain-w)+" FCFA"]]}))return;lastBtn=e.submitter||null;act(()=>sb.rpc("request_withdrawal",{a:w,m,d}),"Demande de retrait envoyée")})()}
 else if(id==="f-par"){const em=$v("pe").trim();if($v("pn").trim().length<2||$v("pp").trim().length<2)return setErr("Entrez votre nom et votre prénom.");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return setErr("Entrez une adresse email valide.");if($v("pq").trim().length<4)return setErr("Entrez votre numéro de paiement.");
  act(()=>sb.rpc("update_profile",{n:$v("pn").trim(),pn:$v("pp").trim(),em,mt:$v("pm"),pay:$v("pq").trim()}),"Compte activé")}});
(async()=>{try{const r=await call("/api/config");window.__cfg=r.data||{}}catch{window.__cfg={}}await load();route();bgDepCheck();if(me)refreshAnn().then(paintDot)})();
</script></body></html>
