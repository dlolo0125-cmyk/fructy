<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#08111f"><title>Fructy — Administration</title><style>
:root{color-scheme:dark;--bg:#08111f;--panel:#101d30;--panel2:#15243a;--line:#263851;--text:#f4f7fb;--muted:#9aabc0;--brand:#77e0c0;--brand2:#9b8cff;--danger:#ff8585;--warning:#f6ca77}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 100% -10%,#243b5b 0,transparent 60%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--brand);color:#092019;font-weight:750}button.secondary{background:#24364f;color:var(--text);border:1px solid var(--line)}button.danger{background:#542b37;color:#ffdce0;border:1px solid #8d4554}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:12px 13px;background:#0a1627;border:1px solid var(--line);border-radius:11px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--brand)}label{display:grid;gap:6px;color:var(--muted);font-size:13px}.wrap{max-width:1120px;margin:auto;padding:28px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{font-size:23px;font-weight:850;letter-spacing:-.8px}.brand span{color:var(--brand)}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:linear-gradient(150deg,#14243a,#0d192b);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 16px 40px #0002}.panel h2{font-size:17px;margin:0 0 14px}.stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.metric{font-size:28px;font-weight:850;letter-spacing:-1px}.pill{display:inline-flex;padding:4px 9px;border-radius:99px;background:#22364d;color:#c8d8e9;font-size:12px}.pill.ok{background:#163b34;color:#9cf0d5}.pill.bad{background:#492a35;color:#ffb8c0}.pill.wait{background:#493c22;color:#ffe0a2}.notice{padding:12px 14px;border-radius:12px;background:#152b3a;color:#c8e8e1;margin:14px 0}.error{background:#402631;color:#ffd0d6}.hidden{display:none!important}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;font-weight:650}td{font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.auth{max-width:460px;margin:7vh auto}.auth h1{font-size:30px;letter-spacing:-1px;margin:0 0 6px}@media(max-width:720px){.grid{grid-template-columns:1fr}.wrap{padding:18px 12px 50px}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}.metric{font-size:24px}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">fructy<span>.</span> <span class="pill">ADMIN</span></div><div class="muted small">Console de gestion sécurisée</div></div><button id="logout" class="secondary hidden" style="flex:0 0 auto">Déconnexion</button></header>
<section id="auth" class="panel auth"><h1>Administration</h1><p class="muted">Connexion réservée aux comptes administrateurs.</p><div id="authmsg" class="notice hidden"></div><div class="stack"><label>Téléphone<input id="phone" placeholder="+228XXXXXXXX"></label><label>Mot de passe<input id="password" type="password"></label><button id="login">Se connecter</button></div></section>
<section id="app" class="hidden"><div class="row" style="justify-content:space-between"><div><h1>Demandes de retrait</h1><p class="muted small">Une approbation ne signifie pas que le paiement a été exécuté.</p></div><button id="refresh" class="secondary" style="flex:0 0 auto">Actualiser</button></div><div class="panel" style="margin-top:16px"><div class="row"><label>Filtrer par statut<select id="status"><option value="">Tous</option><option value="pending">En attente</option><option value="approved">Approuvés</option><option value="paid">Payés</option><option value="rejected">Refusés</option></select></label><div><div class="muted small">Demandes affichées</div><div id="count" class="metric">—</div></div></div><div id="table" class="tablewrap" style="margin-top:14px">Chargement…</div></div><div id="msg" class="notice hidden" role="status"></div></section></main>
<script>
const $=id=>document.getElementById(id);
function message(id,text,error=false){$(id).textContent=text;$(id).classList.remove('hidden','error');if(error)$(id).classList.add('error')}
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error?.message||'Une erreur est survenue.');return d}
function money(v){return new Intl.NumberFormat('fr-FR').format(Number(v||0))+' FCFA'}
async function load(){const me=await api('/api/me');if(me.user.role!=='admin')throw new Error('Ce compte ne possède pas le rôle administrateur.');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');const q=new URLSearchParams({limit:'100'});if($('status').value)q.set('status',$('status').value);const d=await api('/api/admin/withdrawals?'+q);$('count').textContent=d.withdrawals.length;$('table').innerHTML='';if(!d.withdrawals.length){$('table').textContent='Aucune demande pour ce filtre.';return}const table=document.createElement('table');table.innerHTML='<thead><tr><th>Demande</th><th>Membre</th><th>Montant</th><th>Destination</th><th>Statut</th><th>Décision</th></tr></thead>';const body=document.createElement('tbody');for(const w of d.withdrawals){const tr=document.createElement('tr');const values=[w.id.slice(0,8)+'…',w.phone,money(w.amount),w.method+' · '+w.destination,w.status];for(const v of values){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td');if(w.status==='pending'){const approve=document.createElement('button');approve.textContent='Approuver';approve.onclick=()=>review(w.id,'approve');const reject=document.createElement('button');reject.textContent='Refuser';reject.className='danger';reject.style.marginLeft='6px';reject.onclick=()=>review(w.id,'reject');td.append(approve,reject)}else td.textContent='Déjà traitée';tr.append(td);body.append(tr)}table.append(body);$('table').append(table)}
async function review(id,decision){let note='';if(decision==='reject'){note=prompt('Justification obligatoire du refus :')||'';if(!note.trim())return}if(!confirm(decision==='approve'?'Confirmer l’approbation ? Aucun paiement ne sera exécuté automatiquement.':'Confirmer le refus et la restitution des fonds ?'))return;try{await api('/api/admin/withdrawals/'+id+'/review',{method:'POST',body:JSON.stringify({decision,note})});message('msg',decision==='approve'?'Demande approuvée. Paiement externe non exécuté.':'Demande refusée et fonds restitués.');await load()}catch(e){message('msg',e.message,true)}}
$('login').onclick=async()=>{try{await api('/api/login',{method:'POST',body:JSON.stringify({phone:$('phone').value,password:$('password').value})});await load()}catch(e){message('authmsg',e.message,true)}};
$('logout').onclick=async()=>{await api('/api/logout',{method:'POST',body:'{}'});location.reload()};
$('refresh').onclick=()=>load().catch(e=>message('msg',e.message,true));$('status').onchange=()=>load().catch(e=>message('msg',e.message,true));
load().catch(()=>{});
</script></body></html>
