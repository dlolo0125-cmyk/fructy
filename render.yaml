services:
  - type: web
    name: fructy
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # Chaîne de connexion Neon (Settings > Environment). Ne jamais la mettre dans GitHub.
      - key: DATABASE_URL
        sync: false
      - key: SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CHARIOW_PRODUCT_ID
        value: prd_qc1stvd5
      - key: CHARIOW_PRODUCT_ID_M1
        sync: false
      - key: CHARIOW_PRODUCT_ID_M2
        sync: false
      - key: CHARIOW_PRODUCT_ID_M3
        sync: false
      - key: CHARIOW_PRODUCT_ID_M4
        sync: false
      - key: CHARIOW_PRODUCT_ID_M5
        sync: false
      - key: CHARIOW_API_KEY
        sync: false
      - key: CHARIOW_PULSE_SECRET
        sync: false
      - key: SASPAY_API_KEY
        sync: false
      - key: SASPAY_WEBHOOK_SECRET
        sync: false
      - key: SASPAY_NETWORK_TMONEY
        value: tmoney_tg
      - key: SASPAY_NETWORK_FLOOZ
        value: moov_tg
      - key: APP_BASE_URL
        sync: false
